name: Windows native build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build native configurations
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC C++ tools are required' }
          Push-Location windows
          $command = 'call "' + $vs + '\VC\Auxiliary\Build\vcvars64.bat" && cmake --preset windows-x64-debug && cmake --build --preset windows-x64-debug && ctest --preset windows-x64-debug --output-on-failure && cmake --preset windows-x64-release && cmake --build --preset windows-x64-release && ctest --preset windows-x64-release --output-on-failure'
          & cmd.exe /d /c $command
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
      - name: Package portable build and source
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          $command = 'call "' + $vs + '\VC\Auxiliary\Build\vcvars64.bat" && python windows/tools/package.py --build-dir windows/out/x64-release'
          & cmd.exe /d /c $command
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        with:
          name: visual-spc-player-windows-x64
          path: |
            release/Visual-SPC-Player-*-windows-*.zip
            release/SHA256SUMS
          if-no-files-found: error
