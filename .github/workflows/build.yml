name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build emscripten
          npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - run: pnpm test
      - name: Native checks
        run: |
          for configuration in Release Debug; do
            directory="native/build-${configuration,,}"
            cmake -S native -B "$directory" -G Ninja -DCMAKE_BUILD_TYPE="$configuration"
            cmake --build "$directory"
            ctest --test-dir "$directory" --output-on-failure
          done
      - run: pnpm build:release
      - name: WebAssembly and worklet checks
        run: |
          pnpm test:wasm
          pnpm test:protocol
          pnpm test:parity
      - uses: actions/upload-artifact@v7
        with:
          name: visual-spc-player-standalone
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: web-preview
          path: |
            dist/
            Visual-SPC-Player.html
            public/spc_core.wasm
            public/spc_spectrum.wasm
            public/Visual-SPC-Player-source.zip
          if-no-files-found: error

  browser:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [playback, layout, history, graphics]
    env:
      SPC_BROWSER_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: web-preview
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser checks
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          node scripts/serve-dist.mjs > /tmp/spc-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          case "$SUITE" in
            playback) pnpm test:browser && pnpm test:data-views ;;
            layout) pnpm test:underlay-layout ;;
            history) pnpm test:waterfall-retention && pnpm test:waterfall ;;
            graphics) node scripts/spectrum-browser-smoke.mjs && node scripts/web-parity-smoke.mjs && node tests/aram-gpu.browser.mjs && node tests/aram-fallback.browser.mjs ;;
          esac
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-${{ matrix.suite }}
          path: artifacts/
          if-no-files-found: ignore
